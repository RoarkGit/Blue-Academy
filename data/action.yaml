# File for storing role/general action tooltip information.
#
# - id: the action's ID
#   name: the action's name
#   actionType: Spell, Ability or null (for General Actions)
#   range: the action's range
#   radius: the action's radius
#   cast: the action's cast time
#   recast: the action's recast time
#   description: the action's in-game description

- id: addle
  name: Addle
  actionType: Ability
  range: 25
  cast: 0
  recast: 90
  description: |
    Lower's targets physical damage dealt by 5% and magic damage dealt by 10%.

    {{< green "Duration:" >}} 10s
- id: sleep
  name: Sleep
  actionType: Spell
  range: 30
  radius: 5
  cast: 2.5
  recast: 2.5
  mp: 800
  description: |
    Puts target and all nearby enemies to sleep.

    {{< green "Duration:" >}} 30s

    Cancels auto-attack upon execution.
- id: swiftcast
  name: Swiftcast
  actionType: Ability
  cast: 0
  recast: 60
  description: |
    Next spell is cast immediately.

    {{< green "Duration:" >}} 10s
- id: surecast
  name: Surecast
  actionType: Ability
  cast: 0
  recast: 120
  description: |
    Spells can be cast without interruption.

    {{< green "Additional Effect:" >}} Nullifies most knockback and draw-in effects

    {{< green "Duration:" >}} 6s
- id: lucid_dreaming
  name: Lucid Dreaming
  actionType: Ability
  cast: 0
  recast: 60
  description: |
    Gradually restores own MP.

    {{< green "Potency:" >}} 55

    {{< green "Duration:" >}} 21s
- id: sprint
  name: Sprint
  cast: 0
  recast: 60
  description: |
    Increases movement speed.

    {{< green "Duration:" >}} 10s (20s when not in combat)