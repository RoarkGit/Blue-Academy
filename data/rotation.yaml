# File for writing out rotation timelines.
#
# rotation_name:
#   starting_gcd: which GCD to start counting at (default 0)
#   actions:
#     - gcd: action_name
#       ogcd: (optional)
#         - action_name
#         - action_name

moon_flute_winged:
  starting_gcd: -2
  actions:
    - gcd: whistle
    - gcd: tingle
    - gcd: the-rose-of-destruction
    - gcd: moon-flute
      ogcd:
        - j-kick
    - gcd: triple-trident
      ogcd:
        - nightbloom
    - gcd: winged-reprobation
      ogcd:
        - feather-rain
        - sea-shanty
    - gcd: winged-reprobation
      ogcd:
        - shock-strike
        - being-mortal
    - gcd: bristle
      ogcd:
        - role:swiftcast
        - surpanakha
        - surpanakha
        - surpanakha
        - surpanakha
    - gcd: matra-magic
      ogcd:
        - phantom-flurry

