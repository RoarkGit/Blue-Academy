# rotation_name:
#   starting_gcd: which GCD to start counting at (default 0)
#   actions:
#     - {gcd: action_name}
#     - {gcd: action_name, ogcd: [ogcd1, ogcd2]}
#
# Repeat an oGCD N times with spell*N (e.g. surpanakha*4).
# Prefix role/general actions with action: (e.g. action:swiftcast).

moon_flute_winged:
  starting_gcd: -2
  actions:
    - {gcd: whistle}
    - {gcd: tingle}
    - {gcd: the_rose_of_destruction}
    - {gcd: moon_flute, ogcd: [j_kick]}
    - {gcd: triple_trident, ogcd: [nightbloom]}
    - {gcd: winged_reprobation, ogcd: [feather_rain, sea_shanty]}
    - {gcd: winged_reprobation, ogcd: [shock_strike, being_mortal]}
    - {gcd: bristle, ogcd: [swiftcast, surpanakha*4]}
    - {gcd: matra_magic, ogcd: [phantom_flurry]}

moon_flute_flame:
  starting_gcd: -2
  actions:
    - {gcd: whistle}
    - {gcd: tingle}
    - {gcd: the_rose_of_destruction}
    - {gcd: moon_flute, ogcd: [j_kick]}
    - {gcd: triple_trident, ogcd: [nightbloom]}
    - {gcd: bristle, ogcd: [feather_rain, sea_shanty]}
    - {gcd: mortal_flame, ogcd: [shock_strike, being_mortal]}
    - {gcd: bristle, ogcd: [swiftcast, surpanakha*4]}
    - {gcd: matra_magic, ogcd: [phantom_flurry]}

moon_flute_breath:
  starting_gcd: -2
  actions:
    - {gcd: whistle}
    - {gcd: tingle}
    - {gcd: the_rose_of_destruction}
    - {gcd: moon_flute, ogcd: [j_kick]}
    - {gcd: triple_trident, ogcd: [nightbloom]}
    - {gcd: bristle, ogcd: [feather_rain, sea_shanty]}
    - {gcd: breath_of_magic, ogcd: [shock_strike, being_mortal]}
    - {gcd: bristle, ogcd: [swiftcast, surpanakha*4]}
    - {gcd: matra_magic, ogcd: [phantom_flurry]}

moon_flute_even:
  starting_gcd: -2
  actions:
    - {gcd: whistle}
    - {gcd: tingle}
    - {gcd: moon_flute, ogcd: [nightbloom]}
    - {gcd: triple_trident, ogcd: [shock_strike]}
    - {gcd: the_rose_of_destruction, ogcd: [feather_rain]}
    - {gcd: bristle, ogcd: [swiftcast, sea_shanty]}
    - {gcd: matra_magic, ogcd: [j_kick, surpanakha*4, apokalypsis]}

moon_flute_odd:
  starting_gcd: -1
  actions:
    - {gcd: bristle}
    - {gcd: moon_flute}
    - {gcd: song_of_torment, ogcd: [shock_strike]}
    - {gcd: the_rose_of_destruction, ogcd: [feather_rain]}
    - {gcd: winged_reprobation, ogcd: [glass_dance]}
    - {gcd: winged_reprobation, ogcd: [j_kick]}
    - {gcd: winged_reprobation}
    - {gcd: winged_reprobation, ogcd: [phantom_flurry]}
    
moon_flute_breath_even:
  starting_gcd: -2
  actions:
    - {gcd: whistle}
    - {gcd: tingle}
    - {gcd: moon_flute, ogcd: [nightbloom]}
    - {gcd: triple_trident, ogcd: [shock_strike]}
    - {gcd: bristle, ogcd: [feather_rain]}
    - {gcd: breath_of_magic, ogcd: [j_kick]}
    - {gcd: bristle, ogcd: [swiftcast, sea_shanty]}
    - {gcd: matra_magic, ogcd: [surpanakha*4, apokalypsis]}

moon_flute_breath_odd:
  starting_gcd: -2
  actions:
    - {gcd: winged_reprobation}
    - {gcd: bristle}
    - {gcd: moon_flute}
    - {gcd: song_of_torment, ogcd: [shock_strike]}
    - {gcd: bristle, ogcd: [feather_rain]}
    - {gcd: breath_of_magic}
    - {gcd: winged_reprobation, ogcd: [glass_dance]}
    - {gcd: winged_reprobation, ogcd: [j_kick]}
    - {gcd: winged_reprobation, ogcd: [phantom_flurry]}

gavel_skip:
  starting_gcd: -1
  actions:
    - {gcd: song_of_torment}
    - {gcd: phantom_flurry}
    - {gcd: phantom_flurry}
    - {gcd: the_rose_of_destruction, ogcd: [feather_rain]}
    - {gcd: winged_reprobation, ogcd: [shock_strike]}
    - {gcd: winged_reprobation}
    - {gcd: whistle, ogcd: [off-guard]}
    - {gcd: tingle}
    - {gcd: moon_flute, ogcd: [nightbloom]}
    - {gcd: triple_trident, ogcd: [sea_shanty]}
    - {gcd: bristle, ogcd: [swiftcast, being_mortal]}
    - {gcd: matra_magic}
    - {gcd: whistle, ogcd: [surpanakha*4]}
    - {gcd: final_sting}
