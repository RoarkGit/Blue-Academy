# File for writing out rotation timelines.
#
# rotation_name:
#   starting_gcd: which GCD to start counting at (default 0)
#   actions:
#     - gcd: action_name
#       ogcd: (optional)
#         - action_name
#         - action_name

moon_flute_winged:
  starting_gcd: -2
  actions:
    - gcd: whistle
    - gcd: tingle
    - gcd: the_rose_of_destruction
    - gcd: moon_flute
      ogcd:
        - j_kick
    - gcd: triple_trident
      ogcd:
        - nightbloom
    - gcd: winged_reprobation
      ogcd:
        - feather_rain
        - sea_shanty
    - gcd: winged_reprobation
      ogcd:
        - shock_strike
        - being_mortal
    - gcd: bristle
      ogcd:
        - role:swiftcast
        - surpanakha
        - surpanakha
        - surpanakha
        - surpanakha
    - gcd: matra_magic
      ogcd:
        - phantom_flurry

