{{- $title := .Get "title" -}}
{{- $id := .Get "id" }}

{{- if not (and $title $id) -}}
  {{- errorf "The %q shortcode requires a title and etro gearset id. See %s" .Name .Position }}
{{- end -}}
<div class="etro-gearset">
  <iframe
    title="{{ $title }}"
    src="https://etro.gg/embed/gearset/{{ $id }}"
    loading="lazy"></iframe>
</div>
