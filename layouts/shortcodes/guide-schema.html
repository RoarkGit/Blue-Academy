{{- $title := .Get "title" -}}
{{- $description := .Get "description" -}}
{{- $steps := .Get "steps" -}}
{{- $estimatedTime := .Get "estimatedTime" -}}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HowTo",
  "name": "{{ $title }}",
  "description": "{{ $description }}",
  {{- if $estimatedTime }}
  "totalTime": "{{ $estimatedTime }}",
  {{- end }}
  "step": [
    {{- range $index, $step := split $steps "|" -}}
    {{- if gt $index 0 }},{{ end }}
    {
      "@type": "HowToStep",
      "position": "{{ add $index 1 }}",
      "name": "{{ trim $step }}"
    }
    {{- end }}
  ]
}
</script>
