{{- $spell := index (where site.Data.tooltips.spell "id" .id) 0 -}}
{{- $image := printf "/images/spell/%s.png" .id | resources.Get -}}

<span class="tooltip" data-tooltip-id="{{ .id }}-tooltip">
  <span class="tooltip-image"><img src="{{ $image.RelPermalink }}?featherlight=false"></span>
  <span class="tooltip-link">{{ .name }}</span>
</span>
