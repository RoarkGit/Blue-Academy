{{- if ne .Kind "home" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Summary }}{{ end }}",
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "author": {
    "@type": "Organization",
    "name": "Blue Academy"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Blue Academy",
    "logo": {
      "@type": "ImageObject",
      "url": "https://mage.blue/images/logo.png"
    }
  }
  {{- if .Params.image }},
  "image": "{{ .Params.image }}"
  {{- end }}
}
</script>
{{- end }}
