{{- $page := .page }}
{{- $content := .content }}
{{- with $page }}
          <article class="chapter">
            <header class="headline">
              {{- partial "content-header.html" . }}
            </header>
<h1 id="{{ .Title | anchorize }}">{{ .Title }}</h1>{{ partial "heading-post.html" . }}

{{ $content | safeHTML }}
            <footer class="footline">
              {{- partial "content-footer.html" . }}
            </footer>
          </article>
{{- end }}
