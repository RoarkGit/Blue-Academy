baseURL: https://www.mage.blue/
languageCode: en-us
title: Blue Academy
theme: relearn

outputs:
  home:
    - HTML
    - RSS
    - SEARCH

params:
  description:
    'Guides and Resources for the Blue Mage (BLU) job in Final Fantasy XIV
    (FFXIV). Learn how to play Blue Mage: learn spells from monsters, play as a
    tank, healer, or DPS, complete the Masked Carnivale, and complete
    achievements!'
  custom_css: ['css/full-page.css', 'css/spell-tooltip.css']
  disableMermaid: true
  themeVariant: academy
  collapsibleMenu: true

markup:
  goldmark:
    renderer:
      unsafe: true

build:
  noJSConfigInAssets: true

menu:
  shortcuts:
    - name: <i class='fab fa-discord'></i> Discord
      url: https://discord.mage.blue/
      weight: 10
    - name: <i class='fab fa-youtube'></i> Blue Academy
      url: https://youtube.com/c/blueacademy
      weight: 20
    - name: <i class='fab fa-github'></i> Gitub repo
      url: https://github.com/RoarkGit/Blue-Academy
      weight: 30
    - name: <i class='fas fa-donate'></i> Support
      url: /support
      weight: 40
