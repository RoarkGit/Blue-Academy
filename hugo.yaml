baseURL: https://mage.blue/
languageCode: en-us
title: Blue Academy
theme: relearn

outputs:
  home:
    - HTML
    - RSS

params:
  custom_css: ['css/full-page.css']

  disableExplicitIndexURLs: true

  # Relearn Theme Settings
  collapsibleMenu: true
  hideAuthorDate: true
  sidebarheadermenus:
    - type: menu
      identifier: homelinks
      disableTitle: true
  themeVariant: academy

markup:
  goldmark:
    parser:
      attribute:
        block: true

ignoreLogs:
  - warning-goldmark-raw-html

minify:
  minifyOutput: true

build:
  noJSConfigInAssets: true

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml
  ignoreKinds:
    - taxonomy
    - taxonomyTerm

module:
  mounts:
    - source: data
      target: data
      excludeFiles: ["blue-mage-data/**"]
    - source: data/blue-mage-data
      target: data
      includeFiles: ["*.yaml"]
    - source: assets
      target: assets
    - source: data/blue-mage-data/images
      target: assets/images/tooltips

menu:
  shortcuts:
    - name: <i class='fab fa-discord'></i> Discord
      url: https://discord.mage.blue/
      weight: 10
    - name: <i class='fab fa-youtube'></i> Blue Academy
      url: https://youtube.com/c/blueacademy
      weight: 20
    - name: <i class='fab fa-github'></i> GitHub repo
      url: https://github.com/RoarkGit/Blue-Academy
      weight: 30
    - name: <i class='fas fa-donate'></i> Support
      url: /support
      weight: 40
