name: Clean Up Old Production Deployments

on:
  push:
    branches: [main]

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Cloudflare Pages production deployments
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: blue-academy  # update if your Pages project name differs
          KEEP: 2  # newest deployments to retain (current + one rollback)
        run: |
          all_deployments=""
          page=1
          while true; do
            response=$(curl -s \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments?page=$page&per_page=25")

            if [ "$(echo "$response" | jq -r '.success')" != "true" ]; then
              echo "ERROR: Failed to list deployments (page $page)"
              echo "$response" | jq '.errors // []'
              exit 1
            fi

            page_deployments=$(echo "$response" | jq -r \
              '(.result // [])[] | select(.environment == "production") | "\(.id)|\(.created_on)"')
            all_deployments="$all_deployments"$'\n'"$page_deployments"

            total=$(echo "$response" | jq -r '.result_info.total_count // 0')
            fetched=$((page * 25))
            if [ "$fetched" -ge "$total" ]; then
              break
            fi
            page=$((page + 1))
          done

          all_deployments=$(echo "$all_deployments" | grep -v '^$')
          count=$(echo "$all_deployments" | wc -l | tr -d ' ')
          echo "Found $count production deployments, keeping newest $KEEP"

          # Get the currently active deployment
          project_info=$(curl -s \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT")

          if [ "$(echo "$project_info" | jq -r '.success')" != "true" ]; then
            echo "WARNING: Could not fetch project info, being conservative with deletions"
            active_id=""
          else
            active_id=$(echo "$project_info" | jq -r '.result.deployment_configs.production.deployment_id // empty')
          fi

          if [ -z "$active_id" ]; then
            echo "WARNING: Could not determine active deployment ID, will only keep newest $KEEP deployments"
            # Without knowing the active deployment, only keep the KEEP newest ones
            to_delete=$(echo "$all_deployments" | \
              sort -t'|' -k2 -r | \
              awk -F'|' -v keep="$KEEP" \
              'NR > keep { print $1 }')
          else
            echo "Active production deployment: $active_id"
            # Sort by creation date (newest first) and exclude the active deployment
            to_delete=$(echo "$all_deployments" | \
              sort -t'|' -k2 -r | \
              awk -F'|' -v keep="$KEEP" -v active="$active_id" \
              'NR > keep && $1 != active { print $1 }' | \
              head -n "$((count - KEEP))")
          fi

          if [ -z "$to_delete" ]; then
            echo "Nothing to delete"
            exit 0
          fi

          for id in $to_delete; do
            echo "Deleting deployment $id"
            delete_response=$(curl -s -X DELETE \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments/$id")
            echo "Delete response for $id: $delete_response"

            success=$(echo "$delete_response" | jq -r '.success // false')
            if [ "$success" != "true" ]; then
              echo "ERROR: Failed to delete deployment $id"
              echo "$delete_response" | jq '.errors // []'
              exit 1
            fi
          done
