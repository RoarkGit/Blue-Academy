name: Clean Up Old Production Deployments

on:
  push:
    branches: [main]

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Cloudflare Pages production deployments
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: blue-academy  # update if your Pages project name differs
          KEEP: 2  # newest deployments to retain (current + one rollback)
        run: |
          all_deployments=""
          page=1
          while true; do
            response=$(curl -s \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments?page=$page&per_page=25")

            if [ "$(echo "$response" | jq -r '.success')" != "true" ]; then
              echo "ERROR: Failed to list deployments (page $page)"
              echo "$response" | jq '.errors // []'
              exit 1
            fi

            page_deployments=$(echo "$response" | jq -r \
              '(.result // [])[] | select(.environment == "production") | "\(.id)|\(.created_on)|\(.status)"')
            all_deployments="$all_deployments"$'\n'"$page_deployments"

            total=$(echo "$response" | jq -r '.result_info.total_count // 0')
            fetched=$((page * 25))
            if [ "$fetched" -ge "$total" ]; then
              break
            fi
            page=$((page + 1))
          done

          all_deployments=$(echo "$all_deployments" | grep -v '^$')
          count=$(echo "$all_deployments" | wc -l | tr -d ' ')
          echo "Found $count production deployments, keeping newest $KEEP"

          # Sort by creation date (newest first) and exclude deployments with "active" status
          to_delete=$(echo "$all_deployments" | \
            sort -t'|' -k2 -r | \
            awk -F'|' -v keep="$KEEP" \
            'NR > keep && $3 != "active" { print $1 }')

          # Verify we found the active deployment in the list
          has_active=$(echo "$all_deployments" | awk -F'|' '$3 == "active" { count++ } END { print count }')
          if [ -z "$has_active" ] || [ "$has_active" = "0" ]; then
            echo "WARNING: Could not identify active deployment in list, aborting deletion to be safe"
            exit 0
          fi

          if [ -z "$to_delete" ]; then
            echo "Nothing to delete"
            exit 0
          fi

          for id in $to_delete; do
            echo "Deleting deployment $id"
            delete_response=$(curl -s -X DELETE \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments/$id")
            echo "Delete response for $id: $delete_response"

            success=$(echo "$delete_response" | jq -r '.success // false')
            if [ "$success" != "true" ]; then
              echo "ERROR: Failed to delete deployment $id"
              echo "$delete_response" | jq '.errors // []'
              exit 1
            fi
          done
