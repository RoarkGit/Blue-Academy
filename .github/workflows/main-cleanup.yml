name: Clean Up Old Production Deployments

on:
  push:
    branches: [main]

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Cloudflare Pages production deployments
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: blue-academy  # update if your Pages project name differs
          KEEP: 2  # newest deployments to retain (current + one rollback)
        run: |
          # Fetch all production deployments (handle pagination)
          all_deployments="[]"
          page=1
          while true; do
            response=$(curl -s \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments?page=$page&per_page=25")

            if [ "$(echo "$response" | jq -r '.success')" != "true" ]; then
              echo "ERROR: Failed to list deployments (page $page)"
              echo "$response" | jq '.errors // []'
              exit 1
            fi

            page_deployments=$(echo "$response" | jq \
              '[(.result // [])[] | select(.environment == "production") | {id: .id, created_on: .created_on, aliases: .aliases}]')
            all_deployments=$(echo "$all_deployments" "$page_deployments" | jq -s 'add')

            total=$(echo "$response" | jq -r '.result_info.total_count // 0')
            fetched=$((page * 25))
            if [ "$fetched" -ge "$total" ]; then
              break
            fi
            page=$((page + 1))
          done

          count=$(echo "$all_deployments" | jq 'length')
          echo "Found $count production deployments, keeping newest $KEEP"

          # Identify the active deployment (has non-null aliases)
          active_id=$(echo "$all_deployments" | jq -r \
            '.[] | select(.aliases != null) | .id' | head -1)

          if [ -z "$active_id" ]; then
            echo "WARNING: Could not identify active deployment, aborting deletion to be safe"
            exit 0
          fi

          echo "Active deployment: $active_id"

          # Sort by creation date (newest first) and select deployments to delete
          # Keep KEEP newest deployments, never delete the active one
          to_delete=$(echo "$all_deployments" | jq -r \
            "sort_by(.created_on) | reverse | .[${KEEP}:] | map(select(.id != \"$active_id\")) | .[].id")

          if [ -z "$to_delete" ]; then
            echo "Nothing to delete"
            exit 0
          fi

          for id in $to_delete; do
            echo "Deleting deployment $id"
            delete_response=$(curl -s -X DELETE \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments/$id")

            success=$(echo "$delete_response" | jq -r '.success // false')
            if [ "$success" != "true" ]; then
              echo "ERROR: Failed to delete deployment $id"
              echo "$delete_response" | jq '.errors // []'
              exit 1
            else
              echo "Successfully deleted deployment $id"
            fi
          done
